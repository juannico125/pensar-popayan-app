<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pensar Preuniversitario · App</title>
<meta name="description" content="Demo de la app del estudiante de Pensar Preuniversitario — práctica Saber 11 con repaso inteligente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=2026.08.29-2">
<link rel="stylesheet" href="css/app.css?v=2026.08.29-2">
</head>
<body>

<div id="app">

  <!-- ══════════ SPLASH ══════════ -->
  <section class="screen" id="screen-splash">
    <div class="splash">
      <div class="cloud c1" aria-hidden="true"></div>
      <div class="cloud c2" aria-hidden="true"></div>
      <div class="cloud c3" aria-hidden="true"></div>
      <div class="brand-mark lg reveal" style="--i:0">
        <svg class="brand-icon" viewBox="0 0 64 64" width="60" height="60" fill="none" stroke="#26221B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M32 6C21.5 6 13.5 14 13.5 24c0 6.6 3.6 10.4 6.9 13.6 1.7 1.6 2.7 2.9 2.7 4.9h17.8c0-2 1-3.3 2.7-4.9 3.3-3.2 6.9-7 6.9-13.6C50.5 14 42.5 6 32 6Z"/>
          <path d="M23.5 44.5h17M25 49h14M27.5 53.5h9"/>
          <circle cx="32" cy="19" r="3.4" fill="#26221B" stroke="none"/>
          <path d="M24.5 33c0-4.6 3.2-7.6 7.5-7.6s7.5 3 7.5 7.6"/>
        </svg>
        <div class="brand-word"><span class="brand-name">PENSAR</span><span class="brand-city">POPAYÁN</span></div>
      </div>
      <div class="splash-tag reveal" style="--i:1">Preuniversitario</div>
      <div class="bar reveal" style="--i:2"><i id="splash-bar"></i></div>
    </div>
  </section>

  <!-- ══════════ LOGIN ══════════ -->
  <section class="screen" id="screen-login">
    <div class="login-wrap">
      <div class="brand-mark reveal" style="--i:0">
        <svg class="brand-icon" viewBox="0 0 64 64" width="44" height="44" fill="none" stroke="#26221B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M32 6C21.5 6 13.5 14 13.5 24c0 6.6 3.6 10.4 6.9 13.6 1.7 1.6 2.7 2.9 2.7 4.9h17.8c0-2 1-3.3 2.7-4.9 3.3-3.2 6.9-7 6.9-13.6C50.5 14 42.5 6 32 6Z"/>
          <path d="M23.5 44.5h17M25 49h14M27.5 53.5h9"/>
          <circle cx="32" cy="19" r="3.4" fill="#26221B" stroke="none"/>
          <path d="M24.5 33c0-4.6 3.2-7.6 7.5-7.6s7.5 3 7.5 7.6"/>
        </svg>
        <div class="brand-word"><span class="brand-name">PENSAR</span><span class="brand-city">POPAYÁN</span></div>
      </div>
      <p class="login-lead reveal" style="--i:1">Prepárate para el Saber&nbsp;11 con práctica inteligente.</p>

      <div class="field reveal" style="--i:2">
        <label for="login-email">Correo electrónico</label>
        <div class="input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <input type="email" id="login-email" value="demo@pensarpopayan.com" autocomplete="email">
        </div>
      </div>
      <div class="field reveal" style="--i:3">
        <label for="login-pass">Contraseña</label>
        <div class="input-wrap" id="pass-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="login-pass" value="Pensar2026" autocomplete="current-password">
        </div>
        <p class="field-error" id="pass-error">Mínimo 6 caracteres</p>
      </div>
      <label class="check-row reveal" style="--i:4">
        <input type="checkbox" checked> Recordar sesión
      </label>
      <button class="btn btn-primary reveal" style="--i:5" id="btn-login">Ingresar</button>
      <p class="demo-hint reveal" style="--i:6">Demo: demo@pensarpopayan.com · Pensar2026</p>
      <a class="panel-link reveal" style="--i:7" href="panel.html">Ver panel del instituto (web)</a>
    </div>
  </section>

  <!-- ══════════ HOME ══════════ -->
  <section class="screen" id="screen-home">
    <div class="scroll" id="home-scroll"></div>
  </section>

  <!-- ══════════ INTRO DE MATERIA ══════════ -->
  <section class="screen" id="screen-materia">
    <div class="topbar">
      <button class="icon-btn" data-back aria-label="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <div class="title" id="materia-title"></div>
      <div class="spacer"></div>
    </div>
    <div class="scroll no-nav" id="materia-body" style="padding-top:0"></div>
    <div class="cta-bar">
      <button class="btn btn-primary" id="btn-start-quiz">Iniciar práctica</button>
    </div>
  </section>

  <!-- ══════════ QUIZ ══════════ -->
  <section class="screen" id="screen-quiz">
    <div class="topbar">
      <button class="icon-btn" id="btn-quiz-exit" aria-label="Salir de la práctica">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div class="title" id="quiz-title"></div>
      <div class="counter" id="quiz-counter"></div>
    </div>
    <div class="quiz-progress"><i id="quiz-bar"></i></div>
    <div class="scroll no-nav" id="quiz-body"></div>
  </section>

  <!-- ══════════ RESULTADOS ══════════ -->
  <section class="screen" id="screen-results">
    <div class="results-wrap" id="results-body"></div>
    <div class="cta-bar" id="results-cta"></div>
  </section>

  <!-- ══════════ ERRORES ══════════ -->
  <section class="screen" id="screen-mistakes">
    <div class="scroll">
      <h1 class="page-title">Mis errores</h1>
      <div class="chips-scroll" id="mistake-filters"></div>
      <div id="mistake-list"></div>
    </div>
  </section>

  <!-- ══════════ REPASAR ══════════ -->
  <section class="screen" id="screen-review">
    <div class="scroll" id="review-body"></div>
  </section>

  <!-- ══════════ PROGRESO ══════════ -->
  <section class="screen" id="screen-stats">
    <div class="scroll" id="stats-body"></div>
  </section>

  <!-- ══════════ PERFIL ══════════ -->
  <section class="screen" id="screen-profile">
    <div class="scroll" id="profile-body"></div>
  </section>

  <!-- ══════════ NAV INFERIOR ══════════ -->
  <nav class="bottom-nav hidden" id="bottom-nav" aria-label="Navegación principal">
    <button class="nav-item" data-route="home">
      <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
      Inicio
    </button>
    <button class="nav-item" data-route="review">
      <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></span>
      Repasar
    </button>
    <button class="nav-item" data-route="mistakes">
      <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></span>
      Errores
    </button>
    <button class="nav-item" data-route="stats">
      <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg></span>
      Progreso
    </button>
    <button class="nav-item" data-route="profile">
      <span class="nav-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
      Perfil
    </button>
  </nav>

  <!-- ══════════ HOJA DE FEEDBACK ══════════ -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<!-- supabase-js fijado por versión y verificado con SRI: si el CDN sirve otro
     archivo, el navegador lo rechaza en vez de ejecutarlo. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"
        integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="js/config.js?v=2026.08.29-2"></script>
<script src="js/data.js?v=2026.08.29-2"></script>
<script src="js/api.js?v=2026.08.29-2"></script>
<script src="js/app.js?v=2026.08.29-2"></script>
</body>
</html>
